      - >-
        personPagedResults extended with net worth detail — totalAssetsFound,
        estimatedNetWorth, estimatedLiquidAsset, estimatedFamilyNetWorth,
        estimatedFamilyLiquidAsset, wealthTier.
    note: Published on the changelog page without its own date heading.
  - title: Charitable donation, political donation and wealth data released to Data Feed
    breaking: false
    surfaces: [Data Feed]
    additions:
      - Charitable donation tables (donor person id, donor organization id, recipient organization id).
      - >-
        Political donation tables (donor person id, recipient organization id,
        recipient political party organization id, political donation amount).
      - >-
        Wealth asset tables (asset type, asset name, asset purchase date, asset
        ownership percentage, asset value).
    note: Published on the changelog page without its own date heading.
  - title: Additional data points released to Data Feed
    breaking: false
    surfaces: [Data Feed]
    additions:
      - personalInterest table (interest category, interest name, description).
      - >-
        personalNetWorthSummary table (estimated net worth, total assets found,
