generated: '2026-08-14'
method: searched
source: https://docs.altrata.com/developer-changelog
description: >-
  Wealth-X publishes no changelog for the legacy Connect REST API. Its parent
  Altrata publishes a Developer Changelog and a separate Breaking Changes page
  on the unified platform docs that docs.altrata.com/altrata-migration names as
  the migration target for Wealth-X customers. Both are recorded here.
changelog_url: https://docs.altrata.com/developer-changelog
breaking_changes_url: https://docs.altrata.com/breaking-changes
scheme: dated-entries
versioning: >-
  URI path version on every GraphQL service (/v1/graphql). No semantic version
  is published for the API itself; change is communicated per-field through the
  changelog, and through in-band `deprecated` error blocks on the response.
page_last_updated: '2026-07-15'
current_version: v1
entries:
  - date: '2026-07-30'
    source: https://docs.altrata.com/breaking-changes
    title: Committee role changes
    breaking: true
    surfaces: [Data Feed (sFTP, Snowflake, Delta Sharing, S3)]
    highlights:
      - >-
        Altrata role ontology changed so a single disclosed committee can carry
        multiple structured committee categories.
      - >-
        New rolegroupcategory table/view added across the professionalcore and
        wealthcore schemas; it replaces the deprecated role group column on the
        roletitlecategory table/view.
      - >-
        New role group id foreign key on roletitlecategory, and a new
        announcement role group id column on announcementroletitlecategory that
        replaces the deprecated announcement role group column.
      - Requires migration by data feed customers.
  - date: '2026-01-20'
    source: https://docs.altrata.com/breaking-changes
    title: Role alignment update
    breaking: true
    surfaces: [Data Feed]
    highlights:
      - >-
        Separate but concurrent employment and board roles for a given person at
        a given organization are combined into a single role.
  - date: '2025-11-17'
    source: https://docs.altrata.com/developer-changelog
    title: Charitable donation, political donation and wealth data released to API
    breaking: false
    surfaces: [Profile API]
    additions:
      - >-
        New `charitabledonations` query returning id, donorPeople,
        donorOrganization, recipientOrganization, amount, measurementDate.
      - >-
        New `politicaldonations` query returning id, donorPeople,
        recipientOrganization, recipientPerson,
        recipientPoliticalPartyOrganization, amount, measurementDate.
      - >-
        New `wealthassets` query returning id, owner, name, classification,
        type, liquidityType, remarks, value, ownershipPercentage,
        ownershipValue, relatedOrganization, purchaseDate, organizationTicker.
    highlights:
      - >-
        This is the release that brought the Wealth-X-style wealth dataset —
        net worth, asset composition, charitable giving, political donations —
        into the unified Altrata Profile API.
undated_entries:
  - title: New data points released to Profile API (person paged results)
    breaking: false
    surfaces: [Profile API]
    additions:
      - personPagedResults extended with hobby/interest data (pursuit, category, name, description).
      - >-
        personPagedResults extended with personal relationships (name, type,
