exhaustion:
  - status: 429
    condition: Too Many Requests — the per-second rate limit has been exceeded.
    remediation: >-
      Retry with an exponential backoff algorithm with jitter, then resubmit.
      (Verbatim guidance from docs.altrata.com/errors-warnings-and-limits.)
  - status: 429
    condition: Limit Exceeded — the daily quota has been exceeded.
    remediation: >-
      Daily quota is set by subscription entitlement; contact the Altrata
      account representative. The quota value itself is not published.
