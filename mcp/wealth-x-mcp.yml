description: >-
  A real, reachable remote MCP server is operated by Altrata — Wealth-X's parent
  — at https://mcp.altrata.com/mcp. It is OAuth-protected: an anonymous GET or
  POST returns HTTP 401 with
  `WWW-Authenticate: Bearer realm="Altrata MCP", resource_metadata=".../.well-known/oauth-protected-resource/mcp", scope="openid email"`,
  and the protected-resource and authorization-server metadata documents both
  return HTTP 200 with real content. Because the live server rejects anonymous
  `tools/list`, the actual tool names and inputSchemas could not be read; the
  candidate tool list below remains DERIVED from the legacy Wealth-X Connect
  OpenAPI and is explicitly NOT the server's real tool list.
ownership:
  host_owner: Altrata (parent company)
  belongs_to_this_provider: true
  justification: >-
    Wealth-X is an Altrata brand, and Altrata's own developer documentation
    states that customers are migrating "from legacy data products — including
    relationship science, boardex, and wealth x — to the unified altrata
    platform" and publishes a "Wealth-X to Altrata API mapping document"
    (https://docs.altrata.com/altrata-migration). The Altrata Matching API also
    accepts `wxPersonId` — the Wealth-X person identifier — as a first-class
    match input (https://docs.altrata.com/api). The MCP server sits on that
    successor platform, so it is the agent surface for Wealth-X data.
  caveat: >-
    The server is branded "Altrata MCP" and serves the whole Altrata platform
    (BoardEx, WealthEngine, Wealth-X, RelSci, BoardRoom Insiders). If Altrata is
    later profiled as its own provider repo, this artifact should be reconciled
    so the same server is not double-counted.
