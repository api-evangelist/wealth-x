data_packages:
  - name: Core
    availability: Included in all subscriptions (not licensable separately)
    contents: >-
      Foundational person identity/demographics (name, age, gender, DOB, role,
      address, education, interests, achievements, email, nationality,
      birthplace, relationship status, earning indicator) and organization
      reference data (name, type, sector, address, revenue & market cap,
      leadership & board structures, ticker).
  - name: Executive Insights
    availability: Included with Account, Exec, Investor; add-on to other subscriptions
    contents: >-
      Board memberships, time on board, index constituents, corporate
      experience, % women on board, organization financials, role location &
      department, corporate hierarchy, diversity/membership associations,
      corporate advisors & suppliers.
  - name: Wealth Insights
    availability: Included with Buyer; add-on to other subscriptions
    contents: Wealth category, assets, wealth analysis, family details, private foundations, family offices.
  - name: Philanthropy & Political Donations
    availability: Included with Donor; add-on to other subscriptions
    contents: Charitable donations, political donations, wealth category.
  - name: Private Equity & M&A
    availability: Included with Investor; add-on to other subscriptions
    contents: Private equity and M&A data points.
entitlement_behavior:
  note: >-
    Verbatim from the docs: "Your organization's subscription determines which
    entities and fields you receive in APIs and data feeds. If you see fewer
    fields than are documented, this is expected and controlled by your product
    entitlements." Fields outside the entitlement return an error block with
    errorType `unauthorized` while the rest of the response payload stays valid.
  source: https://docs.altrata.com/data-packages-and-subscription-entitlements
