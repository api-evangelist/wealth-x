- aid: wealth-x:altrata-profile-api
  name: Altrata Profile API
  description: >-
    GraphQL search and enrichment across Altrata person and organization
    profiles, including the wealth dataset that Wealth-X contributes — net
    worth, wealth tier, wealth assets, charitable and political donations.
    Published by Altrata, Wealth-X's parent, as the successor to the Wealth-X
    Connect REST API; docs.altrata.com/altrata-migration names Wealth-X as a
    legacy product migrating to this platform and publishes a Wealth-X to
    Altrata API mapping document.
  humanURL: https://docs.altrata.com/profile-api
  baseURL: https://profile.altrata.com/v1/graphql/
  tags:
  - GraphQL
  - Profiles
  - Wealth
  properties:
  - type: Documentation
    url: https://docs.altrata.com/profile-api
  - type: APIReference
    url: https://docs.altrata.com/profile-api
  - type: GraphiQL
    url: https://profile.altrata.com/v1/graphiql/
  - type: RateLimits
