name: Wealth-X
description: >-
  Wealth-X, an Altrata company founded in 2010, provides curated wealth
  intelligence on ultra-high-net-worth (UHNW) and very-high-net-worth (VHNW)
  individuals and their privately held companies. Its Connect API delivers
  Wealth-X dossiers — net worth, careers, interests, philanthropy and
  relationship networks — plus advanced prospect search and bulk/incremental
  sync directly into a subscriber's CRM or data platform. Wealth-X serves
  financial services, luxury, nonprofit and education clients for prospect
  qualification, relationship intelligence and compliance. Altrata's developer
  documentation names Wealth-X as a legacy product migrating to the unified
  Altrata GraphQL platform (Profile, Relationship, Events and Matching APIs),
  which also fronts a live OAuth-protected remote MCP server.
