  - type: ChangeLog
    url: changelog/wealth-x-changelog.yml
- aid: wealth-x:altrata-relationship-api
  name: Altrata Relationship API
  description: >-
    GraphQL API returning ranked relationship paths from the authenticated user
    to a target person or organization (1st and 2nd degree), plus the full
    first-degree network of any person. The successor to the Wealth-X dossier
    "known associates" graph on the unified Altrata platform.
  humanURL: https://docs.altrata.com/relationship-api
  baseURL: https://relationships.altrata.com/v1/graphql/
  tags:
  - GraphQL
  - Relationships
  - Network
  properties:
