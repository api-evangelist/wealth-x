  - type: RateLimits
    url: rate-limits/wealth-x-rate-limits.yml
- aid: wealth-x:altrata-events-api
  name: Altrata Events API
  description: >-
    GraphQL API for leadership and organizational events — primarily executive
    role announcements — queried by person or organization altrataId and sorted
    by effective date, newest first. A polled query API, not a push/webhook
    surface.
  humanURL: https://docs.altrata.com/events-api
  baseURL: https://events.altrata.com/v1/graphql
  tags:
  - GraphQL
  - Events
  - Announcements
  properties:
  - type: Documentation
    url: https://docs.altrata.com/events-api
  - type: APIReference
    url: https://docs.altrata.com/events-api
  - type: GraphiQL
    url: https://events.altrata.com/v1/graphiql
  - type: RateLimits
    url: rate-limits/wealth-x-rate-limits.yml
- aid: wealth-x:altrata-matching-api
  name: Altrata Matching API
  description: >-
    Asynchronous bulk matching of a customer dataset against the Altrata
    dataset. Submit a personsMatch or organizations mutation, receive a
    requestId, poll until matched, then page the results as unique / possible /
    no match. Accepts wxPersonId — the Wealth-X person identifier — as a
    first-class match input, which is how legacy Wealth-X identity resolves into
    the unified model. 6MB maximum per HTTP POST.
  humanURL: https://docs.altrata.com/api
  baseURL: https://matching.altrata.com/v1/graphql
  tags:
  - GraphQL
  - Matching
  - Identity Resolution
  properties:
  - type: Documentation
    url: https://docs.altrata.com/api
  - type: APIReference
    url: https://docs.altrata.com/api
  - type: GraphiQL
    url: https://matching.altrata.com/v1/graphiql
  - type: RateLimits
    url: rate-limits/wealth-x-rate-limits.yml
