    source: https://docs.altrata.com/urls
  - id: graphql-cursor-connections
    conforms: partial
    surface: successor
    evidence: >-
      Relay-style cursor pagination — pageInfo{after,before,first,last} on the
      request, pageInfoResponse{totalCount, pageInfo{hasNextPage,
      hasPreviousPage, startCursor, endCursor}} on the response. Deviates from
      the Relay spec in naming (`items` rather than `edges`/`node`) and requires
      `before` whenever `last` is used.
    source: https://docs.altrata.com/paging
